<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Model in CSS</title>

    <style>
        * {
            margin: 0;
            padding: 0;
        }
        
        .container {
            background-color: rgb(96, 141, 96);
            height: 500px;
            width: 1000px;
            color: black;
            font-size: 3rem;
            /* 50 for top buttom(y-axis) and 20 for left right(x-axis) */
            /* margin: 50px 20px; */
            /* margin: 50px 20px 10px 5px;
            top,
            right,
            bottom,
            left */
            margin: 50px;
            /* (for all sides) */
            padding: 70px;
            /* types same as margin  */
        }
        
        .parent {
            background-color: rgb(102, 102, 190);
            height: 500px;
            width: 500px;
            padding: 50px;
        }
        
        .child {
            background-color: rgb(207, 207, 214);
            height: 200px;
            width: 200px;
        }
    </style>

</head>

<body>
    <div class="container">I am a box</div>


    <div class="parent">Parent Class
        <div class="child">Child Class</div>
    </div>
</body>

</html>
