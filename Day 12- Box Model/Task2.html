<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=\, initial-scale=1.0">
    <title>Task 2</title>

    <style>
        .nature {
            background-color: rgb(174, 193, 214);
            height: 350px;
            width: 280px;
            padding: 20px 25px 10px 10px;
            margin: 50px;
            border: 3px solid black;
            border-radius: 40px;
        }
        
        button {
            background-color: rgb(84, 73, 133);
            border-radius: 50px;
            display: inline -block;
        }
        
        img {
            border-radius: 30px;
        }
        
        .circle {
            height: 30px;
            width: 30px;
            background-color: red;
            /* margin: 20px; */
            border-radius: 50%;
            display: inline-block;
            /* border-radius  -> 50% for perfect circle */
        }
        
        h2 {
            display: inline;
            margin-right: 90px;
        }
        
        p {
            display: inline;
            margin-top: 10px;
        }
        
        h5 {
            display: inline;
            margin-right: 130px;
        }
    </style>
</head>

<body>
    <div class="nature">
        <img src="/nature.jpg" alt="" height="180">


        <div class="content">
            <div class="heading">
                <h2>Nature Image</h2>
                <div class="circle"></div>
            </div>

            <br>
            <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Eveniet laborum quam animi ducimus natus aperiam.</p>
            <br><br>
            <div class="footer">
                <h5>Price: <span style=" color:green; font-weight:bold ">Rs.199</span>
                </h5>
                <button>Buy Now</button>
            </div>
        </div>

    </div>


    <!-- div ->  block element
span -> inline element -->
</body>

</html>
