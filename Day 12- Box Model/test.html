<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Model Test</title>

    <style>
        .parent {
            background-color: rgb(60, 126, 60);
            height: 200px;
            width: 200px;
            padding: 250px;
            margin: 50px;
            border: 5px solid black;
            border-radius: 50px;
        }
        
        .child {
            background-color: rgb(112, 112, 233);
            height: 50px;
            width: 50px;
            text-align: center;
            padding: 70px;
            border: 5px dotted rgb(81, 39, 39);
            border-radius: 30px;
        }
        
        .circle {
            height: 100px;
            width: 100px;
            background-color: red;
            margin: 20px;
            border-radius: 50%;
            /* border-radius  -> 50% for perfect circle */
        }
    </style>
</head>

<body>
    <div class="parent">
        <div class="child">Hello</div>
    </div>

    <br>
    <div class="circle"></div>
</body>

</html>
