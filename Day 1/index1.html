<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>id and class in html</title>

    <style>
        .leaf {
            background-color: brown;
        }
        
        #box {
            color: blue;
        }
    </style>
</head>

<body>
    <!-- id -> unique identifier

class -> multiple tags can have same class-->


    <div class="leaf" id="box">Hello!</div>
    <br>
    <div id="goat">How are you?</div>
    <br>
    <!-- Cannot be used same id (box )like this -->
    <!-- wrong (used same id ) not in the rule of html -->
    <div class="leaf" id="box">Where are you?</div>
</body>

</html>

</html>
