<!DOCTYPE html>
<html lang="en">
<!-- id is used for uniqueness
class -> for styling -->

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>id Example</title>
    <style>
        /* vn  -> view port */
        
        div {
            color: brown;
            margin-bottom: 10px;
            height: 100vh;
            background-color: rgb(165, 165, 18);
            ;
        }
    </style>

</head>

<!-- li*4 for 4 li tags -->
<ul>

    <a href="#home">
        <li>Home</li>
    </a>
    <a href="#contact">
        <li>Contact</li>
    </a>
    <a href="#about">
        <li>About</li>
    </a>
    <a href="#trekking">
        <li>Trekking</li>
    </a>
</ul>


<!-- div*4  for 4 div tags -->
<!-- class cannot be used only id  -->
<!-- Different id name should be given -->
<div id="home">Home Page</div>
<div id="about">About Page</div>
<div id="contact">Contact Page</div>
<div id="trekking">Trekking Page</div>

<body>

</body>

</html>
