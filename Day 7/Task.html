        <!-- Example 2 -->


        <div style="display: flex; gap: 30px;">
            <div>
                <label for="from">FROM</label><br>
                <input type="text" id="from" placeholder="Kathmandu">
            </div>
            <div>
                <label for="to">TO</label><br>
                <input type="text" id="to" placeholder="Destination">
            </div>
        </div>

        <br>

        <div style="display: flex; gap: 30px; ">
            <div>
                <label for="dep">DEPARTURE</label><br>
                <input type="date" id="dep">
            </div>
            <div>
                <label for="adults">ADULTS</label><br>
                <input type="number" id="adults" value="4">
            </div>
        </div>

        <br>

        <div style="display: flex; gap: 30px; ">
            <div>
                <label for="child">CHILDREN</label><br>
                <input type="number" id="child" value="0">
            </div>
            <div>
                <label for="fn">FULL NAME</label><br>
                <input type="text" id="fn" placeholder="Your name ">
            </div>
        </div>

        <br>

        <label for="phn">PHONE</label><br>
        <input type="tel" id="phn" placeholder="98XXXXXXXX ">

        <br><br>

        <label for="email">EMAIL</label><br>
        <input type="email" id="email" placeholder="you@email.com ">

        <br><br>

        <label for="message">MESSAGE(optional)</label><br>
        <textarea placeholder="Preferred airline, timing, notes" id="message"></textarea>

        <br><br>

        <input type="submit" value="Send Booking Enquiry">
    </form>

</body>
