<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selector in CSS</title>

    <style>
        /* Element or tag selectors */
        
        h1 {
            color: red;
            text-align: center;
        }
        
        div {
            color: green;
        }
        /* Class selectors */
        /* id=#,class=. */
        
        .class {
            color: brown;
        }
        /* id selector */
        
        #id {
            color: burlywood;
            background-color: black;
        }
        /* If we have to give same style in different tag  /    also can write class name  */
        /* either  (Group selector) */
        /* p,
        h3,
        span.h1 {
            color: green;
            background-color: burlywood;
        } */
        /* or  (Class Selector) */
        
        .yellow {
            color: green;
            background-color: burlywood;
        }
        /* If we want to give separate style  */
        
        h3 {
            text-align: center;
            font-size: medium;
        }
        /* html and universal selector(*) is same */
        
        * {
            background-color: black;
            ;
        }
    </style>

</head>

<body>

</body>
<h1>I am Heading</h1>
<h1 id="id">I am Heading2</h1>
<div>I am a div</div>
<div class="class">Hello i am div2</div>

<br>
<p class="yellow">I am a paragraph</p>
<h3 class="yellow">Heading3</h3>
<span class="yellow">Here is a span tag</span>
<h1 class="yellow">Heading1</h1>

</html>
