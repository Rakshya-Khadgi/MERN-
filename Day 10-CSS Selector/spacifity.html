<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* New updated style is applied */
        /* universal selector */
        
        * {
            color: yellow;
            background-color: aqua;
            ;
        }
        /* Element Selector */
        
        h1 {
            color: green;
        }
        /* Class selector */
        
        .red {
            color: red;
        }
        /* id selector */
        
        #hello {
            color: black;
        }
    </style>

</head>
<!-- Higher specificity is of inline css
 -->

<body>
    <h1 class="red" id="hello">Heading</h1>

</body>

</html>
