<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Example using internal and inline CSS </title>

    <!-- Internal CSS -->
    <style>
        h1 {
            color: cornflowerblue;
            background-color: rgb(74, 59, 74);
            text-align: center;
            font-size: 20px;
        }
        
        p {
            color: darkred;
            background-color: blanchedalmond;
        }
    </style>
    <!-- For external CSS create a new file and link  -->
</head>

<body>
    <h1>Product Details</h1>
    <p>Product Name</p>

    <!-- Inline CSS -->
    <p>Price <span style="color:rgb(72, 57, 50)">Rs.400</span></p>
</body>

</html>
